name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/test.sh
        shell: bash

  # The README promises Python 3.8+; this job backs that claim.
  oldest-python:
    name: python 3.8
    runs-on: ubuntu-latest
    container: python:3.8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/test.sh
        shell: bash
