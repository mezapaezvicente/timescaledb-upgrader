# kind cluster used by `make up`.
#
# Single control-plane node: nothing in this harness needs a multi-node
# topology, and one node keeps startup fast and the failure modes few.
#
# The node image is pinned by digest so that `make up` produces the same
# Kubernetes version today and in a year. Bump it deliberately, not by drift.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tsdb-upgrader
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
