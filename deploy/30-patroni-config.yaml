apiVersion: v1
kind: ConfigMap
metadata:
  name: __CLUSTER_NAME__-patroni
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: timescaledb-upgrader
data:
  patroni.yml: |
    # Patroni configuration for the test harness.
    #
    # Deliberately contains NO per-pod values. Identity (name, pod IP, advertised
    # addresses) and credentials arrive as PATRONI_* environment variables from
    # the StatefulSet, which override this file. That keeps one ConfigMap valid
    # for every replica.
    scope: __CLUSTER_NAME__

    restapi:
      listen: 0.0.0.0:8008

    kubernetes:
      # Store the leader lock in an Endpoints object rather than a ConfigMap.
      use_endpoints: true
      labels:
        application: patroni
        cluster-name: __CLUSTER_NAME__
      # Pin the role label vocabulary. Patroni has changed these defaults across
      # major versions (master -> primary); the read-only Service selects on
      # them, so state them explicitly instead of inheriting a moving default.
      role_label: role
      leader_label_value: primary
      follower_label_value: replica
      standby_leader_label_value: standby_leader

    bootstrap:
      # Applied only when the cluster is first initialised. Afterwards the
      # authoritative copy of this lives in the DCS; change it with
      # `patronictl edit-config`, not by editing this file.
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            # TimescaleDB is a preload-only extension: without this, CREATE
            # EXTENSION timescaledb fails outright.
            shared_preload_libraries: 'timescaledb'
            max_connections: 100
            wal_level: replica
            hot_standby: 'on'
            max_wal_senders: 10
            max_replication_slots: 10
            wal_log_hints: 'on'
            password_encryption: 'scram-sha-256'
            # Do not phone home from a throwaway test cluster.
            timescaledb.telemetry_level: 'off'
      initdb:
        - encoding: UTF8
        - data-checksums

    postgresql:
      listen: 0.0.0.0:5432
      # Matches PGDATA baked into the timescale/timescaledb-ha image. The PVC is
      # mounted one level up at /home/postgres/pgdata.
      data_dir: /home/postgres/pgdata/data
      # bin_dir is intentionally unset. The image puts the active PostgreSQL
      # major's bin directory first on PATH, so Patroni finds the right binaries
      # without this file hard-coding a major version -- which matters for a
      # repo whose whole purpose is changing that version.
      pgpass: /tmp/pgpass
      authentication:
        superuser:
          username: postgres
        replication:
          username: replicator
      pg_hba:
        - local   all             all                     trust
        - host    all             all         127.0.0.1/32 trust
        - host    all             all         0.0.0.0/0    scram-sha-256
        - host    replication     replicator  0.0.0.0/0    scram-sha-256

    tags:
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false
