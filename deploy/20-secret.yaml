# Throwaway credentials for a local test harness. They are committed on purpose
# so that `make up` works with no prompts and no out-of-band setup.
#
# This Secret is NOT a template for production. On a real cluster these belong
# in a sealed secret / external secret store, and the values must be rotated
# away from the defaults below.
apiVersion: v1
kind: Secret
metadata:
  name: __CLUSTER_NAME__-credentials
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: timescaledb-upgrader
type: Opaque
stringData:
  superuser-password: "local-dev-postgres"
  replication-password: "local-dev-replicator"
